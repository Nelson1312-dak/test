<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenFlow - Thiền Tịnh Vô Đối</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
        }
        h1, h2, h3, .font-space { font-family: 'Space Grotesk', sans-serif; }

        .bg-animated {
            position: fixed;
            top: -5%; left: -5%; width: 110%; height: 110%;
            background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            z-index: -1;
            animation: panBg 60s infinite alternate linear;
            filter: brightness(0.6) contrast(1.1);
        }
        @keyframes panBg {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-1%, -1%); }
        }

        .glass {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* ---- Hidden YouTube iframe ---- */
        #yt-player { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; }

        /* ---- Volume / range ---- */
        input[type=range] {
            -webkit-appearance: none; appearance: none;
            width: 100%; background: transparent;
            position: relative; z-index: 10; cursor: pointer;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px;
            border-radius: 50%; background: #ffffff; cursor: pointer;
            margin-top: -5px; box-shadow: 0 0 10px rgba(255,255,255,0.7);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer;
            background: rgba(255,255,255,0.3); border-radius: 2px;
        }
        input[type=range]::-moz-range-thumb {
            height: 14px; width: 14px; border-radius: 50%;
            background: #ffffff; cursor: pointer; border: none;
            box-shadow: 0 0 10px rgba(255,255,255,0.7);
        }
        input[type=range]::-moz-range-track {
            width: 100%; height: 4px; cursor: pointer;
            background: rgba(255,255,255,0.3); border-radius: 2px;
        }

        .audio-active { opacity: 1 !important; background: rgba(255,255,255,0.15) !important; }

        /* progress bar for YT */
        #yt-progress-container {
            position: relative; height: 4px;
            background: rgba(255,255,255,0.2); border-radius: 2px;
            cursor: pointer; margin-top: 4px;
        }
        #yt-progress-fill {
            height: 100%; border-radius: 2px;
            background: white; width: 0%;
            transition: width 0.5s linear;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* YT section */
        .yt-thumb {
            width: 40px; height: 40px; border-radius: 6px;
            object-fit: cover; flex-shrink: 0;
            background: rgba(255,255,255,0.08);
        }
        .yt-pill {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(255,0,0,0.15); border: 1px solid rgba(255,80,80,0.3);
            border-radius: 20px; padding: 2px 8px; font-size: 11px; color: #fca5a5;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center">

    <div class="bg-animated"></div>

    <!-- Hidden YouTube iframe (API needs a real DOM element) -->
    <div id="yt-player"></div>

    <main class="relative z-10 w-full max-w-6xl mx-auto px-4 py-8 h-screen flex flex-col">
        
        <header class="w-full text-center py-6">
            <h2 class="text-2xl font-space font-bold tracking-widest text-white/80 uppercase">ZenFlow</h2>
            <p id="quote-display" class="mt-4 text-sm md:text-base text-slate-200/80 font-light italic h-12 transition-opacity duration-500"></p>
        </header>

        <div class="flex-1 flex flex-col lg:flex-row items-center justify-center gap-12 w-full">
            
            <!-- TIMER -->
            <div class="glass rounded-[3rem] p-8 md:p-12 flex flex-col items-center justify-center w-full max-w-md relative">
                <div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 100">
                        <circle class="text-white/10 stroke-current" stroke-width="2" cx="50" cy="50" r="48" fill="transparent"></circle>
                        <circle id="progress-circle" class="text-white stroke-current progress-ring__circle" stroke-width="2" stroke-linecap="round" cx="50" cy="50" r="48" fill="transparent" stroke-dasharray="301.59" stroke-dashoffset="0"></circle>
                    </svg>
                    <div class="z-10 flex flex-col items-center">
                        <span id="time-display" class="font-space text-6xl md:text-7xl font-bold tracking-tighter drop-shadow-md">25:00</span>
                        <span id="status-display" class="uppercase tracking-widest text-xs mt-2 text-white/60 font-semibold">Sẵn sàng</span>
                    </div>
                </div>
                <div class="flex items-center gap-6 mt-10">
                    <button id="reset-btn" class="p-3 rounded-full text-white/70 hover:text-white hover:bg-white/10 transition-colors">
                        <i class="ph ph-arrow-counter-clockwise text-2xl"></i>
                    </button>
                    <button id="play-pause-btn" class="w-16 h-16 rounded-full bg-white text-slate-900 flex items-center justify-center hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                        <i class="ph-fill ph-play text-3xl ml-1" id="play-icon"></i>
                    </button>
                    <button id="mode-btn" class="p-3 rounded-full text-white/70 hover:text-white hover:bg-white/10 transition-colors" title="Đổi thời gian">
                        <i class="ph ph-timer text-2xl"></i>
                    </button>
                </div>
            </div>

            <!-- MIXER -->
            <div class="glass rounded-3xl p-6 w-full max-w-sm flex flex-col gap-5">
                <h3 class="font-space text-lg font-semibold tracking-wide text-white/90 text-center md:text-left">Không gian âm thanh</h3>

                <!-- ======= YOUTUBE MUSIC CHANNEL ======= -->
                <div class="flex flex-col gap-3 border border-white/10 rounded-2xl p-4 bg-white/5">
                    
                    <!-- Header row -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="yt-pill"><i class="ph-fill ph-youtube-logo"></i> YouTube</span>
                        </div>
                        <div class="flex gap-1 text-white/70">
                            <button id="yt-prev" class="p-1.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors" title="Bài trước"><i class="ph-fill ph-skip-back text-sm"></i></button>
                            <button id="yt-play-pause" class="p-1.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors" title="Play/Pause"><i class="ph-fill ph-play text-sm" id="yt-play-icon"></i></button>
                            <button id="yt-next" class="p-1.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors" title="Bài tiếp"><i class="ph-fill ph-skip-forward text-sm"></i></button>
                        </div>
                    </div>

                    <!-- Now playing -->
                    <button id="open-yt-playlist" class="flex items-center gap-3 w-full text-left hover:bg-white/5 rounded-xl p-1.5 -m-1.5 transition-colors group">
                        <img id="yt-thumb" class="yt-thumb" src="" alt="thumbnail">
                        <div class="flex-1 min-w-0">
                            <p id="yt-title" class="text-xs font-medium text-white/90 truncate">Chọn bài hát...</p>
                            <p id="yt-channel" class="text-xs text-white/40 truncate mt-0.5">YouTube Music</p>
                        </div>
                        <i class="ph ph-caret-right text-white/30 group-hover:text-white/60 transition-colors flex-shrink-0"></i>
                    </button>

                    <!-- Progress bar -->
                    <div id="yt-progress-container" title="Tua bài hát">
                        <div id="yt-progress-fill"></div>
                    </div>

                    <!-- Volume -->
                    <div class="flex items-center gap-3">
                        <button id="yt-toggle" class="w-8 h-8 rounded-full glass-btn flex items-center justify-center flex-shrink-0 text-red-300 audio-active" title="Bật/Tắt">
                            <i class="ph-fill ph-speaker-high text-sm"></i>
                        </button>
                        <input type="range" id="yt-volume" min="0" max="100" value="70" class="flex-1">
                    </div>
                </div>

                <!-- Rain -->
                <div class="flex items-center gap-4">
                    <button class="w-10 h-10 rounded-full glass-btn flex items-center justify-center flex-shrink-0 text-blue-300 audio-toggle opacity-50" data-track="rain" title="Bật/Tắt Mưa">
                        <i class="ph-fill ph-cloud-rain text-xl"></i>
                    </button>
                    <div class="flex-1">
                        <div class="flex justify-between text-xs text-white/60 mb-2"><span>Tiếng Mưa</span></div>
                        <input type="range" min="0" max="100" value="0" class="volume-slider" data-track="rain">
                    </div>
                </div>

                <!-- Fire -->
                <div class="flex items-center gap-4">
                    <button class="w-10 h-10 rounded-full glass-btn flex items-center justify-center flex-shrink-0 text-orange-400 audio-toggle opacity-50" data-track="fire" title="Bật/Tắt Lửa">
                        <i class="ph-fill ph-fire text-xl"></i>
                    </button>
                    <div class="flex-1">
                        <div class="flex justify-between text-xs text-white/60 mb-2"><span>Lửa Trại</span></div>
                        <input type="range" min="0" max="100" value="0" class="volume-slider" data-track="fire">
                    </div>
                </div>

                <!-- Waves -->
                <div class="flex items-center gap-4">
                    <button class="w-10 h-10 rounded-full glass-btn flex items-center justify-center flex-shrink-0 text-cyan-200 audio-toggle opacity-50" data-track="waves" title="Bật/Tắt Sóng">
                        <i class="ph-fill ph-waves text-xl"></i>
                    </button>
                    <div class="flex-1">
                        <div class="flex justify-between text-xs text-white/60 mb-2"><span>Sóng Biển</span></div>
                        <input type="range" min="0" max="100" value="0" class="volume-slider" data-track="waves">
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="w-full text-center py-4 text-white/30 text-xs">
            Bấm Play hoặc chọn bài từ thư viện YouTube để bắt đầu.
        </footer>
    </main>

    <!-- Time modal -->
    <div id="time-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity">
        <div class="glass rounded-2xl p-8 max-w-sm w-full mx-4 transform scale-95 transition-transform" id="time-modal-content">
            <h3 class="text-xl font-space mb-6 text-center">Chọn thời gian</h3>
            <div class="mb-6">
                <div class="flex justify-between text-white/70 text-sm mb-2">
                    <span>1p</span>
                    <span id="slider-val-display" class="font-bold text-white">25 phút</span>
                    <span>180p</span>
                </div>
                <input type="range" id="time-slider" min="1" max="180" value="25" class="w-full">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button class="time-preset glass-btn py-3 rounded-xl font-medium" data-time="10">10 Phút</button>
                <button class="time-preset glass-btn py-3 rounded-xl font-medium" data-time="30">30 Phút</button>
                <button class="time-preset glass-btn py-3 rounded-xl font-medium" data-time="60">1 Giờ</button>
                <button class="time-preset glass-btn py-3 rounded-xl font-medium" data-time="180">3 Giờ</button>
            </div>
            <button id="close-modal-btn" class="mt-6 w-full py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-colors">Lưu & Đóng</button>
        </div>
    </div>

    <!-- YouTube playlist modal -->
    <div id="yt-playlist-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity">
        <div class="glass rounded-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform" id="yt-playlist-modal-content">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-4">
                <div>
                    <h3 class="text-lg font-space font-medium text-white">Thư viện YouTube Music</h3>
                    <p class="text-xs text-white/40 mt-0.5">Chọn bài hoặc dán link YouTube</p>
                </div>
                <button id="close-yt-playlist" class="text-white/50 hover:text-white bg-white/5 hover:bg-white/10 rounded-full p-2 transition-colors">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>

            <!-- Add custom YouTube URL -->
            <div class="flex gap-2 mb-4">
                <input type="text" id="yt-url-input" placeholder="Dán link YouTube vào đây..." 
                    class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm text-white placeholder-white/30 focus:outline-none focus:border-white/30">
                <button id="yt-url-add" class="px-3 py-2 bg-red-500/20 border border-red-400/30 text-red-300 rounded-xl text-sm hover:bg-red-500/30 transition-colors whitespace-nowrap">
                    + Thêm
                </button>
            </div>

            <div id="yt-playlist-container" class="flex flex-col gap-2 max-h-[320px] overflow-y-auto pr-1 custom-scrollbar">
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
    // ======= YOUTUBE PLAYLIST =======
    const ytTracks = [
        { id: "jfKfPfyJRdk", title: "lofi hip hop radio - beats to relax/study to", channel: "Lofi Girl" },
        { id: "4xDzrJKXOOY", title: "synthwave radio - beats to chill/game to", channel: "Lofi Girl" },
        { id: "Na0w3Mz46GA", title: "Coffee Shop Ambience - Jazz Lofi", channel: "Dreamy" },
        { id: "lTRiuFIWV54", title: "lofi hip hop radio - chill beats to study", channel: "ChillHop Music" },
        { id: "7NOSDKb0HlU", title: "Deep Focus - Music For Studying", channel: "Greenred Productions" },
    ];

    let ytPlayer = null;
    let ytCurrentIdx = 0;
    let ytReady = false;
    let ytVolume = 70;
    let ytMuted = false;
    let ytProgressInterval = null;

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player', {
            height: '1', width: '1',
            videoId: ytTracks[0].id,
            playerVars: {
                autoplay: 0, controls: 0, disablekb: 1,
                fs: 0, modestbranding: 1, rel: 0,
                iv_load_policy: 3, playsinline: 1
            },
            events: {
                onReady: onYtReady,
                onStateChange: onYtStateChange,
                onError: onYtError
            }
        });
    }

    function onYtReady(e) {
        ytReady = true;
        e.target.setVolume(ytVolume);
        updateYtUI(ytCurrentIdx, false);
    }

    function onYtStateChange(e) {
        if (e.data === YT.PlayerState.PLAYING) {
            document.getElementById('yt-play-icon').className = 'ph-fill ph-pause text-sm';
            startYtProgress();
        } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.BUFFERING) {
            document.getElementById('yt-play-icon').className = 'ph-fill ph-play text-sm';
            if (e.data !== YT.PlayerState.BUFFERING) stopYtProgress();
        } else if (e.data === YT.PlayerState.ENDED) {
            loadYtTrack((ytCurrentIdx + 1) % ytTracks.length, true);
        }
    }

    function onYtError(e) {
        console.log('YouTube error:', e.data);
        setTimeout(() => loadYtTrack((ytCurrentIdx + 1) % ytTracks.length, isRunning), 2000);
    }

    function loadYtTrack(idx, autoplay) {
        ytCurrentIdx = idx;
        updateYtUI(idx, true);
        if (!ytReady || !ytPlayer) return;
        if (autoplay) {
            ytPlayer.loadVideoById(ytTracks[idx].id);
        } else {
            ytPlayer.cueVideoById(ytTracks[idx].id);
            document.getElementById('yt-play-icon').className = 'ph-fill ph-play text-sm';
        }
        renderYtPlaylist();
    }

    function updateYtUI(idx, loading) {
        const track = ytTracks[idx];
        document.getElementById('yt-title').textContent = loading ? '⏳ Đang tải...' : track.title;
        document.getElementById('yt-channel').textContent = track.channel;
        document.getElementById('yt-thumb').src = `https://img.youtube.com/vi/${track.id}/mqdefault.jpg`;
        document.getElementById('yt-progress-fill').style.width = '0%';
    }

    function startYtProgress() {
        stopYtProgress();
        ytProgressInterval = setInterval(() => {
            if (!ytReady || !ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
            try {
                const cur = ytPlayer.getCurrentTime();
                const dur = ytPlayer.getDuration();
                if (dur > 0) {
                    document.getElementById('yt-progress-fill').style.width = (cur / dur * 100).toFixed(1) + '%';
                }
                // Update now-playing title after loaded
                const title = ytPlayer.getVideoData && ytPlayer.getVideoData().title;
                if (title && title !== ytTracks[ytCurrentIdx].title) {
                    document.getElementById('yt-title').textContent = ytTracks[ytCurrentIdx].title;
                }
            } catch(e) {}
        }, 800);
    }

    function stopYtProgress() {
        if (ytProgressInterval) { clearInterval(ytProgressInterval); ytProgressInterval = null; }
    }

    // Seek by clicking progress bar
    document.getElementById('yt-progress-container').addEventListener('click', (e) => {
        if (!ytReady || !ytPlayer) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        const dur = ytPlayer.getDuration();
        if (dur > 0) ytPlayer.seekTo(pct * dur, true);
    });

    // Play/pause YouTube
    document.getElementById('yt-play-pause').addEventListener('click', () => {
        if (!ytReady || !ytPlayer) return;
        const state = ytPlayer.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
            ytPlayer.pauseVideo();
        } else {
            ytPlayer.playVideo();
            if (!isRunning) toggleTimer();
        }
    });

    document.getElementById('yt-prev').addEventListener('click', () => {
        loadYtTrack((ytCurrentIdx - 1 + ytTracks.length) % ytTracks.length, isRunning);
    });

    document.getElementById('yt-next').addEventListener('click', () => {
        loadYtTrack((ytCurrentIdx + 1) % ytTracks.length, isRunning);
    });

    // Volume
    const ytVolumeSlider = document.getElementById('yt-volume');
    ytVolumeSlider.addEventListener('input', (e) => {
        ytVolume = parseInt(e.target.value);
        if (ytReady && ytPlayer) ytPlayer.setVolume(ytVolume);
        ytMuted = ytVolume === 0;
        const icon = document.querySelector('#yt-toggle i');
        icon.className = ytVolume === 0 ? 'ph-fill ph-speaker-slash text-sm' : 'ph-fill ph-speaker-high text-sm';
    });

    // Toggle mute
    document.getElementById('yt-toggle').addEventListener('click', () => {
        if (ytMuted) {
            ytVolume = 70; ytMuted = false;
            ytVolumeSlider.value = 70;
            if (ytReady && ytPlayer) { ytPlayer.unMute(); ytPlayer.setVolume(70); }
            document.querySelector('#yt-toggle i').className = 'ph-fill ph-speaker-high text-sm';
        } else {
            ytMuted = true;
            ytVolumeSlider.value = 0;
            if (ytReady && ytPlayer) ytPlayer.mute();
            document.querySelector('#yt-toggle i').className = 'ph-fill ph-speaker-slash text-sm';
        }
    });

    // ======= YT PLAYLIST MODAL =======
    const ytPlModal = document.getElementById('yt-playlist-modal');
    const ytPlModalContent = document.getElementById('yt-playlist-modal-content');

    function openYtPlaylist() {
        renderYtPlaylist();
        ytPlModal.classList.remove('opacity-0', 'pointer-events-none');
        ytPlModalContent.classList.remove('scale-95');
    }
    function closeYtPlaylist() {
        ytPlModal.classList.add('opacity-0', 'pointer-events-none');
        ytPlModalContent.classList.add('scale-95');
    }

    document.getElementById('open-yt-playlist').addEventListener('click', openYtPlaylist);
    document.getElementById('close-yt-playlist').addEventListener('click', closeYtPlaylist);
    ytPlModal.addEventListener('click', (e) => { if (e.target === ytPlModal) closeYtPlaylist(); });

    // Add custom URL
    document.getElementById('yt-url-add').addEventListener('click', () => {
        const input = document.getElementById('yt-url-input');
        const url = input.value.trim();
        const match = url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
        if (!match) { alert('Link YouTube không hợp lệ. Hãy thử lại!'); return; }
        const videoId = match[1];
        const exists = ytTracks.find(t => t.id === videoId);
        if (exists) { alert('Bài này đã có trong danh sách rồi!'); return; }
        ytTracks.push({ id: videoId, title: `Video: ${videoId}`, channel: 'YouTube' });
        input.value = '';
        renderYtPlaylist();
        loadYtTrack(ytTracks.length - 1, isRunning);
        closeYtPlaylist();
    });

    function renderYtPlaylist() {
        const container = document.getElementById('yt-playlist-container');
        container.innerHTML = '';
        ytTracks.forEach((track, index) => {
            const isActive = index === ytCurrentIdx;
            const item = document.createElement('button');
            item.className = `w-full text-left px-3 py-2.5 rounded-xl transition-all flex items-center gap-3 group ${isActive ? 'bg-red-500/15 border border-red-400/25' : 'bg-white/5 border border-transparent hover:bg-white/10'}`;
            item.innerHTML = `
                <img src="https://img.youtube.com/vi/${track.id}/mqdefault.jpg" 
                     class="w-10 h-10 rounded-lg object-cover flex-shrink-0 bg-white/10">
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium truncate ${isActive ? 'text-white' : 'text-white/70'}">${track.title}</p>
                    <p class="text-xs text-white/40 truncate mt-0.5">${track.channel}</p>
                </div>
                ${isActive ? '<i class="ph-fill ph-waves text-red-300 animate-pulse flex-shrink-0"></i>' : ''}
            `;
            item.onclick = () => { loadYtTrack(index, true); closeYtPlaylist(); if (!isRunning) toggleTimer(); };
            container.appendChild(item);
        });
    }

    // ======= AMBIENT AUDIO =======
    const audioSources = {
        rain: 'https://cdn.pixabay.com/audio/2021/08/09/audio_289a2e6f47.mp3',
        fire: 'https://cdn.pixabay.com/audio/2022/01/20/audio_51cbfa79fc.mp3',
        waves: 'https://cdn.pixabay.com/audio/2022/03/09/audio_f83daef2c5.mp3'
    };
    const audioElements = {
        rain: new Audio(audioSources.rain),
        fire: new Audio(audioSources.fire),
        waves: new Audio(audioSources.waves)
    };
    audioElements.rain.loop = true;
    audioElements.fire.loop = true;
    audioElements.waves.loop = true;

    const volumeSliders = document.querySelectorAll('.volume-slider');
    const audioToggles = document.querySelectorAll('.audio-toggle');

    const savedVolumes = JSON.parse(localStorage.getItem('audioVolumes')) || { rain: 0, fire: 0, waves: 0 };
    Object.keys(savedVolumes).forEach(key => {
        const slider = document.querySelector(`.volume-slider[data-track="${key}"]`);
        if (slider) {
            slider.value = savedVolumes[key];
            updateVolumeUI(key, savedVolumes[key]);
            if (audioElements[key]) audioElements[key].volume = savedVolumes[key] / 100;
        }
    });

    function updateVolumeUI(track, value) {
        const btn = document.querySelector(`.audio-toggle[data-track="${track}"]`);
        if (!btn) return;
        if (parseInt(value) > 0) { btn.classList.remove('opacity-50'); btn.classList.add('audio-active'); }
        else { btn.classList.add('opacity-50'); btn.classList.remove('audio-active'); }
    }

    volumeSliders.forEach(slider => {
        slider.addEventListener('input', (e) => {
            const trackId = e.target.getAttribute('data-track');
            const val = parseInt(e.target.value);
            audioElements[trackId].volume = val / 100;
            const vols = JSON.parse(localStorage.getItem('audioVolumes')) || {};
            vols[trackId] = val;
            localStorage.setItem('audioVolumes', JSON.stringify(vols));
            updateVolumeUI(trackId, val);
            if (isRunning && val > 0 && audioElements[trackId].paused) {
                audioElements[trackId].play().catch(e => {});
            }
        });
    });

    audioToggles.forEach(toggle => {
        toggle.addEventListener('click', (e) => {
            const btn = e.currentTarget;
            const trackId = btn.getAttribute('data-track');
            const slider = document.querySelector(`.volume-slider[data-track="${trackId}"]`);
            if (btn.classList.contains('opacity-50')) {
                btn.classList.remove('opacity-50'); btn.classList.add('audio-active');
                slider.value = 50;
                const vols = JSON.parse(localStorage.getItem('audioVolumes')) || {};
                vols[trackId] = 50; localStorage.setItem('audioVolumes', JSON.stringify(vols));
                audioElements[trackId].volume = 0.5;
                if (isRunning) audioElements[trackId].play().catch(e => {});
            } else {
                btn.classList.add('opacity-50'); btn.classList.remove('audio-active');
                slider.value = 0;
                const vols = JSON.parse(localStorage.getItem('audioVolumes')) || {};
                vols[trackId] = 0; localStorage.setItem('audioVolumes', JSON.stringify(vols));
                audioElements[trackId].pause();
            }
        });
    });

    // ======= QUOTES =======
    const quotes = [
        "Hít vào tâm tĩnh lặng, thở ra miệng mỉm cười.",
        "Sự bình yên đến từ bên trong, đừng tìm nó ở bên ngoài.",
        "Hãy để mọi thứ trôi qua như những đám mây trên bầu trời.",
        "Mỗi khoảnh khắc là một cơ hội để bắt đầu lại.",
        "Tập trung vào hiện tại là chiếc chìa khóa của hạnh phúc.",
        "Không có con đường dẫn đến hạnh phúc, hạnh phúc chính là con đường.",
        "Tĩnh lặng không phải là trống rỗng, nó chứa đầy những câu trả lời."
    ];
    const quoteDisplay = document.getElementById('quote-display');
    function changeQuote() {
        quoteDisplay.style.opacity = 0;
        setTimeout(() => {
            quoteDisplay.textContent = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
            quoteDisplay.style.opacity = 1;
        }, 500);
    }
    setInterval(changeQuote, 15000);
    changeQuote();

    // ======= TIMER =======
    let timerDuration = 25 * 60;
    let timeRemaining = timerDuration;
    let timerInterval = null;
    let isRunning = false;

    const timeDisplay = document.getElementById('time-display');
    const statusDisplay = document.getElementById('status-display');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const resetBtn = document.getElementById('reset-btn');
    const progressCircle = document.getElementById('progress-circle');
    const circumference = 48 * 2 * Math.PI;
    progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
    progressCircle.style.strokeDashoffset = 0;

    function formatTime(s) {
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function updateDisplay() {
        timeDisplay.textContent = formatTime(timeRemaining);
        progressCircle.style.strokeDashoffset = circumference - (timeRemaining / timerDuration) * circumference;
    }

    function startAudio() {
        // Play YouTube if it was playing
        if (ytReady && ytPlayer) {
            const state = ytPlayer.getPlayerState();
            if (state !== YT.PlayerState.PLAYING) ytPlayer.playVideo();
        }
        // Play ambient
        Object.keys(audioElements).forEach(trackId => {
            const slider = document.querySelector(`.volume-slider[data-track="${trackId}"]`);
            if (!slider) return;
            const vol = parseInt(slider.value);
            if (vol > 0 && audioElements[trackId].paused) {
                audioElements[trackId].volume = vol / 100;
                audioElements[trackId].play().catch(e => {});
            }
        });
    }

    function pauseAudio() {
        if (ytReady && ytPlayer) ytPlayer.pauseVideo();
        Object.keys(audioElements).forEach(trackId => {
            if (!audioElements[trackId].paused) audioElements[trackId].pause();
        });
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timerInterval);
            pauseAudio();
            playIcon.className = 'ph-fill ph-play text-3xl ml-1';
            statusDisplay.textContent = "Tạm dừng";
        } else {
            if (timeRemaining === 0) timeRemaining = timerDuration;
            startAudio();
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateDisplay();
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    playIcon.className = 'ph-fill ph-play text-3xl ml-1';
                    statusDisplay.textContent = "Hoàn thành!";
                    pauseAudio();
                    const toast = document.createElement('div');
                    toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-white text-slate-900 px-6 py-3 rounded-full shadow-lg font-medium z-50 animate-bounce';
                    toast.innerText = "🔔 Đã hết thời gian! Nghỉ ngơi chút nhé.";
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 5000);
                }
            }, 1000);
            playIcon.className = 'ph-fill ph-pause text-3xl';
            statusDisplay.textContent = "Đang tập trung";
        }
        isRunning = !isRunning;
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        timeRemaining = timerDuration;
        pauseAudio();
        playIcon.className = 'ph-fill ph-play text-3xl ml-1';
        statusDisplay.textContent = "Sẵn sàng";
        updateDisplay();
    }

    playPauseBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
        if (e.key.toLowerCase() === 'r') resetTimer();
    });

    // ======= TIME MODAL =======
    const modeBtn = document.getElementById('mode-btn');
    const timeModal = document.getElementById('time-modal');
    const timeModalContent = document.getElementById('time-modal-content');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const timeSlider = document.getElementById('time-slider');
    const sliderValDisplay = document.getElementById('slider-val-display');

    modeBtn.addEventListener('click', () => {
        timeModal.classList.remove('opacity-0','pointer-events-none');
        timeModalContent.classList.remove('scale-95');
    });
    closeModalBtn.addEventListener('click', () => {
        timeModal.classList.add('opacity-0','pointer-events-none');
        timeModalContent.classList.add('scale-95');
    });
    timeSlider.addEventListener('input', (e) => {
        const mins = e.target.value;
        sliderValDisplay.textContent = `${mins} phút`;
        timerDuration = mins * 60;
        resetTimer();
    });
    document.querySelectorAll('.time-preset').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const mins = parseInt(e.target.getAttribute('data-time'));
            timeSlider.value = mins;
            sliderValDisplay.textContent = `${mins} phút`;
            timerDuration = mins * 60;
            resetTimer();
            timeModal.classList.add('opacity-0','pointer-events-none');
            timeModalContent.classList.add('scale-95');
        });
    });
    timeModal.addEventListener('click', (e) => {
        if (e.target === timeModal) { timeModal.classList.add('opacity-0','pointer-events-none'); timeModalContent.classList.add('scale-95'); }
    });

    updateDisplay();
    updateYtUI(0, false);
    </script>
</body>
</html>
