<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box}
        body{font-family:'Inter',sans-serif;margin:0;overflow:hidden;background:#0f172a;color:white}
        h1,h2,h3,.font-space{font-family:'Space Grotesk',sans-serif}

        #bg-main{position:fixed;top:-5%;left:-5%;width:110%;height:110%;background-size:cover;background-position:center;z-index:0;animation:panBg 60s infinite alternate linear;filter:brightness(0.55) contrast(1.1)}
        @keyframes panBg{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.06) translate(-1%,-1%)}}
        @keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

        .bg-gradient-anim{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e,#1a1a2e,#16213e,#0f3460);background-size:400% 400%;animation:gradShift 20s ease infinite}
        .bg-aurora{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#001a0e,#003320,#0a4a1a,#052a30,#001a2e);background-size:400% 400%;animation:gradShift 18s ease infinite}
        .bg-sunset{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#1a0533,#3d0b00,#7c1900,#3d0b00,#1a0533,#0d0221);background-size:400% 400%;animation:gradShift 22s ease infinite}
        .bg-ocean{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#000428,#004e92,#000428,#001a4e,#004e92);background-size:400% 400%;animation:gradShift 16s ease infinite}
        .bg-sakura{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#1a0a14,#3d1a2e,#6b2d4a,#3d1a2e,#1a0a14,#2d0f24);background-size:400% 400%;animation:gradShift 24s ease infinite}
        .bg-zen{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0a0a0f,#111118,#0d1117,#0a0f1a,#080d14);background-size:400% 400%;animation:gradShift 30s ease infinite}
        .bg-neon{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#050510,#0a0520,#05102a,#020815,#08051a);background-size:400% 400%;animation:gradShift 12s ease infinite}

        #star-canvas{position:fixed;inset:0;z-index:0;display:none}
        @keyframes zenBreath{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.3}50%{transform:translate(-50%,-50%) scale(1.4);opacity:0.7}}
        #bg-overlay{position:fixed;inset:0;z-index:1;background:rgba(0,0,0,0.12);pointer-events:none}

        .glass{background:rgba(15,23,42,0.42);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
        .glass-btn{background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);transition:all 0.3s ease}
        .glass-btn:hover{background:rgba(255,255,255,0.2);transform:translateY(-2px)}
        .progress-ring__circle{transition:stroke-dashoffset 0.1s linear;transform:rotate(-90deg);transform-origin:50% 50%}
        #yt-player{position:absolute;top:-9999px;left:-9999px;width:1px;height:1px}

        input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;position:relative;z-index:10;cursor:pointer}
        input[type=range]:focus{outline:none}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;border-radius:50%;background:#fff;cursor:pointer;margin-top:-5px;box-shadow:0 0 10px rgba(255,255,255,0.7)}
        input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;cursor:pointer;background:rgba(255,255,255,0.25);border-radius:2px}
        input[type=range]::-moz-range-thumb{height:14px;width:14px;border-radius:50%;background:#fff;cursor:pointer;border:none;box-shadow:0 0 10px rgba(255,255,255,0.7)}
        input[type=range]::-moz-range-track{width:100%;height:4px;cursor:pointer;background:rgba(255,255,255,0.25);border-radius:2px}

        .audio-active{opacity:1!important;background:rgba(255,255,255,0.15)!important}
        #yt-progress-container{position:relative;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;cursor:pointer;margin-top:4px}
        #yt-progress-fill{height:100%;border-radius:2px;background:white;width:0%;transition:width 0.5s linear}

        .custom-scrollbar::-webkit-scrollbar{width:6px}
        .custom-scrollbar::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);border-radius:10px}
        .custom-scrollbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:10px}
        .custom-scrollbar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.4)}

        .yt-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,0,0,0.15);border:1px solid rgba(255,80,80,0.3);border-radius:20px;padding:2px 8px;font-size:11px;color:#fca5a5}

        .bg-option{width:48px;height:48px;border-radius:12px;cursor:pointer;border:2px solid transparent;transition:all 0.25s ease;flex-shrink:0;overflow:hidden;position:relative}
        .bg-option:hover{transform:scale(1.1)}
        .bg-option.active{border-color:white;box-shadow:0 0 0 2px rgba(255,255,255,0.35)}
        .bg-option img,.bg-option>div{width:100%;height:100%;object-fit:cover;display:block}

        .particle{position:fixed;border-radius:50%;opacity:0;animation:float-up linear infinite;pointer-events:none;z-index:1}
        @keyframes float-up{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:0.5}90%{opacity:0.15}100%{transform:translateY(-10vh) scale(1.5);opacity:0}}
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center">

    <canvas id="star-canvas"></canvas>
    <div id="bg-main"></div>
    <div id="bg-overlay"></div>
    <div id="yt-player"></div>

    <main class="relative z-10 w-full max-w-6xl mx-auto px-4 py-6 h-screen flex flex-col">

        <header class="w-full py-4 flex items-center justify-between">
            <div class="w-10"></div>
            <div class="flex-1 text-center">
                <h2 class="text-xl font-space font-bold tracking-widest text-white/80 uppercase">ZenFlow</h2>
                <p id="quote-display" class="mt-2 text-xs md:text-sm text-slate-200/70 font-light italic h-8 transition-opacity duration-500"></p>
            </div>
            <div class="flex items-center gap-2">
                <span id="bg-label" class="text-white/30 text-xs font-light tracking-wide hidden md:block"></span>
                <button id="bg-next-btn" class="w-10 h-10 rounded-full glass-btn flex items-center justify-center text-white/70 hover:text-white transition-all" title="Chuyển hình nền">
                    <i class="ph ph-arrow-circle-right text-xl"></i>
                </button>
            </div>
        </header>

        <div class="flex-1 flex flex-col lg:flex-row items-center justify-center gap-10 w-full">

            <!-- TIMER -->
            <div class="glass rounded-[3rem] p-8 md:p-10 flex flex-col items-center justify-center w-full max-w-md">
                <div class="relative w-60 h-60 md:w-72 md:h-72 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 100">
                        <circle class="text-white/10 stroke-current" stroke-width="2" cx="50" cy="50" r="48" fill="transparent"></circle>
                        <circle id="progress-circle" class="text-white stroke-current progress-ring__circle" stroke-width="2" stroke-linecap="round" cx="50" cy="50" r="48" fill="transparent" stroke-dasharray="301.59" stroke-dashoffset="0"></circle>
                    </svg>
                    <div class="z-10 flex flex-col items-center">
                        <span id="time-display" class="font-space text-5xl md:text-6xl font-bold tracking-tighter drop-shadow-md">25:00</span>
                        <span id="status-display" class="uppercase tracking-widest text-xs mt-2 text-white/60 font-semibold">Sẵn sàng</span>
                    </div>
                </div>
                <div class="flex items-center gap-6 mt-8">
                    <button id="reset-btn" class="p-3 rounded-full text-white/70 hover:text-white hover:bg-white/10 transition-colors"><i class="ph ph-arrow-counter-clockwise text-2xl"></i></button>
                    <button id="play-pause-btn" class="w-16 h-16 rounded-full bg-white text-slate-900 flex items-center justify-center hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                        <i class="ph-fill ph-play text-3xl ml-1" id="play-icon"></i>
                    </button>
                    <button id="mode-btn" class="p-3 rounded-full text-white/70 hover:text-white hover:bg-white/10 transition-colors" title="Đổi thời gian"><i class="ph ph-timer text-2xl"></i></button>
                </div>
            </div>

            <!-- MIXER -->
            <div class="glass rounded-3xl p-5 w-full max-w-sm flex flex-col gap-4">
                <h3 class="font-space text-base font-semibold tracking-wide text-white/90">Không gian âm thanh</h3>

                <!-- YouTube -->
                <div class="flex flex-col gap-3 border border-white/10 rounded-2xl p-3.5 bg-white/5">
                    <div class="flex items-center justify-between">
                        <span class="yt-pill"><i class="ph-fill ph-youtube-logo"></i> YouTube</span>
                        <div class="flex gap-1 text-white/70">
                            <button id="yt-prev" class="p-1.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors"><i class="ph-fill ph-skip-back text-sm"></i></button>
                            <button id="yt-play-pause" class="p-1.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors"><i class="ph-fill ph-play text-sm" id="yt-play-icon"></i></button>
                            <button id="yt-next" class="p-1.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors"><i class="ph-fill ph-skip-forward text-sm"></i></button>
                        </div>
                    </div>
                    <button id="open-yt-playlist" class="flex items-center gap-3 w-full text-left hover:bg-white/5 rounded-xl p-1.5 -m-1.5 transition-colors group">
                        <img id="yt-thumb" class="w-10 h-10 rounded-lg object-cover flex-shrink-0 bg-white/10" src="" alt="">
                        <div class="flex-1 min-w-0">
                            <p id="yt-title" class="text-xs font-medium text-white/90 truncate">Chọn bài hát...</p>
                            <p id="yt-channel" class="text-xs text-white/40 truncate mt-0.5">YouTube Music</p>
                        </div>
                        <i class="ph ph-caret-right text-white/30 group-hover:text-white/60 flex-shrink-0"></i>
                    </button>
                    <div id="yt-progress-container"><div id="yt-progress-fill"></div></div>
                    <div class="flex items-center gap-3">
                        <button id="yt-toggle" class="w-8 h-8 rounded-full glass-btn flex items-center justify-center flex-shrink-0 text-red-300 audio-active">
                            <i class="ph-fill ph-speaker-high text-sm"></i>
                        </button>
                        <input type="range" id="yt-volume" min="0" max="100" value="70">
                    </div>
                </div>

                <!-- Rain -->
                <div class="flex items-center gap-4">
                    <button class="w-10 h-10 rounded-full glass-btn flex items-center justify-center flex-shrink-0 text-blue-300 ambient-toggle opacity-50" data-sound="rain">
                        <i class="ph-fill ph-cloud-rain text-xl"></i>
                    </button>
                    <div class="flex-1">
                        <div class="text-xs text-white/50 mb-2">Tiếng Mưa</div>
                        <input type="range" min="0" max="100" value="0" class="ambient-slider" data-sound="rain">
                    </div>
                </div>

                <!-- Fire -->
                <div class="flex items-center gap-4">
                    <button class="w-10 h-10 rounded-full glass-btn flex items-center justify-center flex-shrink-0 text-orange-400 ambient-toggle opacity-50" data-sound="fire">
                        <i class="ph-fill ph-fire text-xl"></i>
                    </button>
                    <div class="flex-1">
                        <div class="text-xs text-white/50 mb-2">Lửa Trại</div>
                        <input type="range" min="0" max="100" value="0" class="ambient-slider" data-sound="fire">
                    </div>
                </div>

                <!-- Waves -->
                <div class="flex items-center gap-4">
                    <button class="w-10 h-10 rounded-full glass-btn flex items-center justify-center flex-shrink-0 text-cyan-200 ambient-toggle opacity-50" data-sound="waves">
                        <i class="ph-fill ph-waves text-xl"></i>
                    </button>
                    <div class="flex-1">
                        <div class="text-xs text-white/50 mb-2">Sóng Biển</div>
                        <input type="range" min="0" max="100" value="0" class="ambient-slider" data-sound="waves">
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center py-3 text-white/25 text-xs">Space để play/pause · R để reset</footer>
    </main>

    <!-- BG PICKER MODAL -->
    <div id="bg-modal" class="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass rounded-t-3xl md:rounded-3xl p-6 w-full max-w-md mx-0 md:mx-4" id="bg-modal-content">
            <div class="flex justify-between items-center mb-5">
                <div>
                    <h3 class="text-lg font-space font-medium">Hình nền</h3>
                    <p class="text-xs text-white/40 mt-0.5">Chọn không gian của bạn</p>
                </div>
                <button id="close-bg-modal" class="text-white/50 hover:text-white bg-white/5 hover:bg-white/10 rounded-full p-2 transition-colors"><i class="ph ph-x text-lg"></i></button>
            </div>
            <p class="text-xs text-white/40 uppercase tracking-widest mb-3">Ảnh thực</p>
            <div class="flex gap-3 mb-5 overflow-x-auto pb-1">
                <button class="bg-option" data-bg="photo-stars" title="Bầu trời sao"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=100&q=60" alt=""></button>
                <button class="bg-option" data-bg="photo-forest" title="Rừng đêm"><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=100&q=60" alt=""></button>
                <button class="bg-option" data-bg="photo-mountain" title="Núi tuyết"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=100&q=60" alt=""></button>
                <button class="bg-option" data-bg="photo-beach" title="Bãi biển"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=100&q=60" alt=""></button>
                <button class="bg-option" data-bg="photo-cafe" title="Quán cafe"><img src="https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=100&q=60" alt=""></button>
                <button class="bg-option" data-bg="photo-rain" title="Mưa đêm"><img src="https://images.unsplash.com/photo-1428592953211-077101b2021b?w=100&q=60" alt=""></button>
            </div>
            <p class="text-xs text-white/40 uppercase tracking-widest mb-3">Động ✨</p>
            <div class="flex gap-3 overflow-x-auto pb-1">
                <button class="bg-option" data-bg="anim-galaxy" title="Galaxy"><div style="background:linear-gradient(135deg,#0f0c29,#302b63,#24243e)"></div></button>
                <button class="bg-option" data-bg="anim-aurora" title="Cực quang"><div style="background:linear-gradient(135deg,#001a0e,#0a4a1a,#052a30)"></div></button>
                <button class="bg-option" data-bg="anim-sunset" title="Hoàng hôn"><div style="background:linear-gradient(135deg,#3d0b00,#7c1900,#1a0533)"></div></button>
                <button class="bg-option" data-bg="anim-ocean" title="Đại dương"><div style="background:linear-gradient(135deg,#000428,#004e92)"></div></button>
                <button class="bg-option" data-bg="anim-stars" title="Sao rơi ✨"><div style="background:linear-gradient(135deg,#05030a,#0d0b26);display:flex;align-items:center;justify-content:center;font-size:18px">✨</div></button>
            </div>
        </div>
    </div>

    <!-- TIME MODAL -->
    <div id="time-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity">
        <div class="glass rounded-2xl p-8 max-w-sm w-full mx-4 transform scale-95 transition-transform" id="time-modal-content">
            <h3 class="text-xl font-space mb-6 text-center">Chọn thời gian</h3>
            <div class="mb-6">
                <div class="flex justify-between text-white/70 text-sm mb-2"><span>1p</span><span id="slider-val-display" class="font-bold text-white">25 phút</span><span>180p</span></div>
                <input type="range" id="time-slider" min="1" max="180" value="25">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button class="time-preset glass-btn py-3 rounded-xl font-medium" data-time="10">10 Phút</button>
                <button class="time-preset glass-btn py-3 rounded-xl font-medium" data-time="30">30 Phút</button>
                <button class="time-preset glass-btn py-3 rounded-xl font-medium" data-time="60">1 Giờ</button>
                <button class="time-preset glass-btn py-3 rounded-xl font-medium" data-time="180">3 Giờ</button>
            </div>
            <button id="close-modal-btn" class="mt-6 w-full py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-colors">Lưu & Đóng</button>
        </div>
    </div>

    <!-- YT PLAYLIST MODAL -->
    <div id="yt-playlist-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity">
        <div class="glass rounded-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform" id="yt-playlist-modal-content">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-4">
                <div>
                    <h3 class="text-lg font-space font-medium">Thư viện YouTube</h3>
                    <p class="text-xs text-white/40 mt-0.5">Dán link YouTube để thêm bài</p>
                </div>
                <button id="close-yt-playlist" class="text-white/50 hover:text-white bg-white/5 hover:bg-white/10 rounded-full p-2 transition-colors"><i class="ph ph-x text-lg"></i></button>
            </div>
            <div class="flex gap-2 mb-4">
                <input type="text" id="yt-url-input" placeholder="youtube.com/watch?v=..."
                    class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm text-white placeholder-white/30 focus:outline-none focus:border-white/30">
                <button id="yt-url-add" class="px-3 py-2 bg-red-500/20 border border-red-400/30 text-red-300 rounded-xl text-sm hover:bg-red-500/30 transition-colors whitespace-nowrap">+ Thêm</button>
            </div>
            <div id="yt-playlist-container" class="flex flex-col gap-2 max-h-72 overflow-y-auto pr-1 custom-scrollbar"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
    // ============================================================
    // BACKGROUND SYSTEM
    // ============================================================
    const photoUrls = {
        'photo-stars':    'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80',
        'photo-forest':   'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80',
        'photo-mountain': 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80',
        'photo-beach':    'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80',
        'photo-cafe':     'https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1920&q=80',
        'photo-rain':     'https://images.unsplash.com/photo-1428592953211-077101b2021b?auto=format&fit=crop&w=1920&q=80',
    };

    // Ordered list for next-bg cycling
    const bgList = [
        {id:'photo-stars',    label:'Bầu trời sao'},
        {id:'photo-forest',   label:'Rừng đêm'},
        {id:'photo-mountain', label:'Núi tuyết'},
        {id:'photo-beach',    label:'Bãi biển'},
        {id:'photo-cafe',     label:'Quán cafe'},
        {id:'photo-rain',     label:'Mưa đêm'},
        {id:'anim-galaxy',    label:'Galaxy ✦'},
        {id:'anim-aurora',    label:'Cực quang'},
        {id:'anim-sunset',    label:'Hoàng hôn'},
        {id:'anim-ocean',     label:'Đại dương'},
        {id:'anim-stars',     label:'Sao rơi ✦'},
        {id:'anim-sakura',    label:'Sakura ✦'},
        {id:'anim-zen',       label:'Zen Dark'},
        {id:'anim-neon',      label:'Neon City ✦'},
    ];
    let currentBgIdx = 0;

    let starAnimFrame = null;
    let neonAnimFrame = null;
    const bgMain = document.getElementById('bg-main');
    const starCanvas = document.getElementById('star-canvas');
    const starCtx = starCanvas.getContext('2d');

    function clearParticles() { document.querySelectorAll('.particle, #zen-orb').forEach(p => p.remove()); }

    function spawnParticles(c1, c2) {
        clearParticles();
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 7 + 2;
            p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${Math.random()>0.5?c1:c2};animation-duration:${Math.random()*14+9}s;animation-delay:${Math.random()*8}s;filter:blur(${size>6?1:0}px)`;
            document.body.appendChild(p);
        }
    }

    let stars = [];
    function resizeStarCanvas() { starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight; }
    function initStars() {
        stars = [];
        for (let i = 0; i < 180; i++) stars.push({ x:Math.random()*starCanvas.width, y:Math.random()*starCanvas.height, r:Math.random()*1.5+0.2, alpha:Math.random(), speed:Math.random()*0.004+0.001, shooting:false });
    }
    let shootTimer = 0;
    function animateStars() {
        starCtx.fillStyle = '#05030a';
        starCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);
        shootTimer++;
        if (shootTimer > 100 && Math.random() < 0.05) {
            shootTimer = 0;
            stars.push({ x:Math.random()*starCanvas.width*0.7, y:Math.random()*starCanvas.height*0.4, r:1.2, alpha:1, speed:0, shooting:true, sx:4+Math.random()*6, sy:2+Math.random()*4, sl:0, maxL:80+Math.random()*70 });
        }
        stars.forEach((s, i) => {
            if (s.shooting) {
                starCtx.beginPath(); starCtx.strokeStyle=`rgba(255,255,255,${s.alpha})`; starCtx.lineWidth=1.5;
                starCtx.moveTo(s.x,s.y); starCtx.lineTo(s.x-s.sl*0.55,s.y-s.sl*0.3); starCtx.stroke();
                s.x+=s.sx; s.y+=s.sy; s.sl+=s.sx; s.alpha-=0.014;
                if (s.alpha<=0||s.sl>s.maxL) stars.splice(i,1);
            } else {
                s.alpha += s.speed*(Math.random()>0.5?1:-1);
                s.alpha = Math.max(0.05,Math.min(1,s.alpha));
                starCtx.beginPath(); starCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
                starCtx.fillStyle=`rgba(255,255,255,${s.alpha})`; starCtx.fill();
            }
        });
        starAnimFrame = requestAnimationFrame(animateStars);

    // --- Neon city canvas ---
    let neonAnimFrame = null;
    function animateNeon() {
        const ctx = starCtx;
        let t = 0;
        const neonColors = ['#ff00ff','#00ffff','#ff0080','#8000ff','#0080ff','#ff8000'];
        function draw() {
            ctx.fillStyle = 'rgba(5,5,16,0.15)';
            ctx.fillRect(0,0,starCanvas.width,starCanvas.height);
            t += 0.008;
            // Neon grid lines
            for (let i = 0; i < 6; i++) {
                const x = (i / 6) * starCanvas.width + Math.sin(t + i) * 20;
                ctx.beginPath();
                ctx.moveTo(x, 0); ctx.lineTo(x, starCanvas.height);
                ctx.strokeStyle = `rgba(${i%2?0:255},${i%3?0:200},255,0.04)`;
                ctx.lineWidth = 1; ctx.stroke();
            }
            // Floating neon dots
            for (let i = 0; i < 3; i++) {
                const x = starCanvas.width * (0.2 + i * 0.3) + Math.sin(t * 0.7 + i * 2) * 60;
                const y = starCanvas.height * 0.5 + Math.cos(t * 0.5 + i) * 80;
                const r = 2 + Math.abs(Math.sin(t + i)) * 3;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fillStyle = neonColors[(i + Math.floor(t)) % neonColors.length];
                ctx.fill();
                // Glow ring
                ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI*2);
                ctx.strokeStyle = neonColors[(i + Math.floor(t)) % neonColors.length].replace('ff','33');
                ctx.lineWidth = 1; ctx.stroke();
            }
            // Stars
            if (stars.length < 60) initStars();
            stars.slice(0,60).forEach(s => {
                s.alpha += s.speed * (Math.random() > 0.5 ? 1 : -1);
                s.alpha = Math.max(0.05, Math.min(0.6, s.alpha));
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.7, 0, Math.PI*2);
                ctx.fillStyle = `rgba(180,180,255,${s.alpha})`; ctx.fill();
            });
            neonAnimFrame = requestAnimationFrame(draw);
        }
        draw();
    }

    // WEB AUDIO — AMBIENT SOUNDS (synthetic, no files needed)
    // ============================================================
    let audioCtx = null;
    const ambientNodes = {};

    function getCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function makeNoise(ctx, dur) {
        const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
        const src = ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        return src;
    }

    function createRain(vol) {
        const ctx = getCtx();
        const src = makeNoise(ctx, 2);
        const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1600;
        const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9000;
        const gain = ctx.createGain(); gain.gain.value = vol * 0.55;
        src.connect(hp); hp.connect(lp); lp.connect(gain); gain.connect(ctx.destination);
        src.start();
        return { gain, stop(){ try{src.stop()}catch(e){} } };
    }

    function createFire(vol) {
        const ctx = getCtx();
        // Layer 1: base rumble (low noise)
        const src1 = makeNoise(ctx, 2);
        const lp1 = ctx.createBiquadFilter(); lp1.type='lowpass'; lp1.frequency.value=500;
        const lp2 = ctx.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=250;
        const g1 = ctx.createGain(); g1.gain.value = vol * 0.4;
        src1.connect(lp1); lp1.connect(lp2); lp2.connect(g1); g1.connect(ctx.destination);
        // Layer 2: crackle (mid noise burst via separate gain modulation)
        const src2 = makeNoise(ctx, 1);
        const hp = ctx.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=1200; hp.Q.value=0.8;
        const g2 = ctx.createGain(); g2.gain.value = 0;
        src2.connect(hp); hp.connect(g2); g2.connect(ctx.destination);
        // Simulate random crackles via setValueAtTime scheduling
        const masterGain = ctx.createGain(); masterGain.gain.value = vol;
        function scheduleCrackles() {
            const now = ctx.currentTime;
            for (let i = 0; i < 8; i++) {
                const t = now + Math.random() * 1.5;
                const amp = Math.random() * vol * 0.3;
                g2.gain.setValueAtTime(amp, t);
                g2.gain.setValueAtTime(0, t + 0.04 + Math.random() * 0.06);
            }
        }
        scheduleCrackles();
        const crackleTimer = setInterval(scheduleCrackles, 1200);
        src1.start(); src2.start();
        return {
            gain: g1,
            _g2: g2, _vol: vol,
            setVol(v) { g1.gain.setTargetAtTime(v*0.4, ctx.currentTime, 0.1); },
            stop(){ clearInterval(crackleTimer); try{src1.stop();src2.stop()}catch(e){} }
        };
    }

    function createWaves(vol) {
        const ctx = getCtx();
        const master = ctx.createGain(); master.gain.value = vol * 0.65;
        master.connect(ctx.destination);
        const srcs = [], lfos = [];
        for (let i=0; i<4; i++) {
            const src = makeNoise(ctx, 3);
            const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=180+i*90; bp.Q.value=0.6;
            const g = ctx.createGain(); g.gain.value=0.22;
            const lfo = ctx.createOscillator(); lfo.frequency.value=0.07+i*0.025;
            const lg = ctx.createGain(); lg.gain.value=0.25;
            lfo.connect(lg); lg.connect(g.gain);
            src.connect(bp); bp.connect(g); g.connect(master);
            src.start(); lfo.start(); srcs.push(src); lfos.push(lfo);
        }
        return { gain:master, stop(){ srcs.forEach(s=>{try{s.stop()}catch(e){}});lfos.forEach(l=>{try{l.stop()}catch(e){}}) } };
    }

    const creators = { rain:createRain, fire:createFire, waves:createWaves };

    function setVol(sound, vol) {
        const n = ambientNodes[sound];
        if (!n) return;
        if (sound === 'fire' && n.setVol) { n.setVol(vol); return; }
        n.gain.gain.setTargetAtTime(vol * {rain:0.55,waves:0.65}[sound] || vol*0.5, getCtx().currentTime, 0.1);
    }

    const progressCircle=document.getElementById('progress-circle'),circumference=48*2*Math.PI;
    progressCircle.style.strokeDasharray=`${circumference} ${circumference}`;progressCircle.style.strokeDashoffset=0;

    function formatTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
    function updateDisplay(){timeDisplay.textContent=formatTime(timeRemaining);progressCircle.style.strokeDashoffset=circumference-(timeRemaining/timerDuration)*circumference;}

    function startAllAudio(){
        getCtx(); // resume AudioContext
        const saved=JSON.parse(localStorage.getItem('zf-amb')||'{}');
        Object.entries(saved).forEach(([s,v])=>{if(v>0&&!ambientNodes[s]) ambientNodes[s]=creators[s](v/100);});
        if(ytReady&&ytPlayer&&ytPlayer.getPlayerState()!==YT.PlayerState.PLAYING) ytPlayer.playVideo();
    }
    function pauseAllAudio(){
        if(ytReady&&ytPlayer)ytPlayer.pauseVideo();
        // ambient keeps running in background — stop nodes to save resources
        Object.keys(ambientNodes).forEach(s=>{ ambientNodes[s].stop(); delete ambientNodes[s]; });
    }

    function toggleTimer(){
        if(isRunning){
            clearInterval(timerInterval);pauseAllAudio();
            playIcon.className='ph-fill ph-play text-3xl ml-1';statusDisplay.textContent='Tạm dừng';
        } else {
            if(timeRemaining===0) timeRemaining=timerDuration;
            startAllAudio();
            timerInterval=setInterval(()=>{
                timeRemaining--;updateDisplay();
                if(timeRemaining<=0){
                    clearInterval(timerInterval);isRunning=false;
                    playIcon.className='ph-fill ph-play text-3xl ml-1';statusDisplay.textContent='Hoàn thành!';
                    pauseAllAudio();
                    const t=document.createElement('div');
                    t.className='fixed top-4 left-1/2 -translate-x-1/2 bg-white text-slate-900 px-6 py-3 rounded-full shadow-lg font-medium z-50 animate-bounce';
                    t.innerText='🔔 Đã hết thời gian! Nghỉ ngơi chút nhé.';
                    document.body.appendChild(t);setTimeout(()=>t.remove(),5000);
                }
            },1000);
            playIcon.className='ph-fill ph-pause text-3xl';statusDisplay.textContent='Đang tập trung';
        }
        isRunning=!isRunning;
    }
    function resetTimer(){
        clearInterval(timerInterval);isRunning=false;timeRemaining=timerDuration;
        pauseAllAudio();playIcon.className='ph-fill ph-play text-3xl ml-1';statusDisplay.textContent='Sẵn sàng';updateDisplay();
    }

    document.getElementById('play-pause-btn').addEventListener('click',toggleTimer);
    document.getElementById('reset-btn').addEventListener('click',resetTimer);
    document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggleTimer();}if(e.key.toLowerCase()==='r')resetTimer();});

    const timeModal=document.getElementById('time-modal'),tmC=document.getElementById('time-modal-content');
    document.getElementById('mode-btn').addEventListener('click',()=>{timeModal.classList.remove('opacity-0','pointer-events-none');tmC.classList.remove('scale-95');});
    document.getElementById('close-modal-btn').addEventListener('click',()=>{timeModal.classList.add('opacity-0','pointer-events-none');tmC.classList.add('scale-95');});
    document.getElementById('time-slider').addEventListener('input',e=>{document.getElementById('slider-val-display').textContent=`${e.target.value} phút`;timerDuration=e.target.value*60;resetTimer();});
    document.querySelectorAll('.time-preset').forEach(btn=>btn.addEventListener('click',e=>{
        const m=parseInt(e.currentTarget.dataset.time);
        document.getElementById('time-slider').value=m;document.getElementById('slider-val-display').textContent=`${m} phút`;
        timerDuration=m*60;resetTimer();timeModal.classList.add('opacity-0','pointer-events-none');tmC.classList.add('scale-95');
    }));
    timeModal.addEventListener('click',e=>{if(e.target===timeModal){timeModal.classList.add('opacity-0','pointer-events-none');tmC.classList.add('scale-95');}});

    updateDisplay();
    updateYtUI(0,false);
    </script>
</body>
</html>
